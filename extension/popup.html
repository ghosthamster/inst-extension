<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inst · Quick Share</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><img class="mark" src="icons/icon-128.png" width="44" height="44" alt=""><div><h1>Quick Share</h1><p>Your people. One shortcut.</p></div></header>
<form id="settings"><fieldset id="fields" disabled><legend>Favourite contacts</legend><p id="hint">Usernames or profile links. Select your default.</p><div id="contacts"></div><label class="quiet"><input id="quiet" type="checkbox" checked> Quiet sharing</label><p class="note">Hide Instagram’s Share dialog; reveal it if sharing fails.</p><button type="submit" id="save">Save contacts</button></fieldset></form>
<section><button id="share" class="primary" disabled>Send to default</button><p class="shortcut">Default: <kbd id="shortcut"></kbd></p><div class="actions"><button id="picker" disabled>Choose contact</button><button id="compose" disabled>Add message</button></div><p class="shortcut">Picker: <kbd id="picker-key"></kbd> · Message: <kbd id="compose-key"></kbd></p><p class="note">Direct shortcuts send immediately. Slot shortcuts can be assigned below.</p></section>
<p id="status" role="status" aria-live="polite"></p>
<footer><button id="shortcuts" class="link">Configure shortcuts</button><a href="https://www.instagram.com/reels/" target="_blank" rel="noreferrer">Open Reels ↗</a></footer>
<script src="core.js"></script><script src="popup.js"></script>
</body></html>
